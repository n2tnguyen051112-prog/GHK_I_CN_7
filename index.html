<script id="game-data" type="application/json">{"title":"Công nghệ 7 – Giữa kỳ I","source":"SGK Công nghệ 7 – Kết nối tri thức với cuộc sống, Chương I","questions":[{"n":1,"question":"Đâu không phải là vai trò chính của ngành trồng trọt đối với đời sống con người và nền kinh tế?","options":["Cung cấp lương thực, thực phẩm cho con người.","Cung cấp thức ăn cho ngành chăn nuôi.","Cung cấp sức kéo chủ yếu cho máy móc công nghiệp.","Cung cấp nguyên liệu cho công nghiệp chế biến và nông sản xuất khẩu."],"answer":"C","explanation":"Ngành trồng trọt cung cấp lương thực, thực phẩm, thức ăn chăn nuôi, nguyên liệu chế biến và nông sản xuất khẩu; không cung cấp sức kéo cho máy móc công nghiệp.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":2,"question":"Nhóm cây nào sau đây thuộc nhóm cây lương thực?","options":["Lúa, ngô, khoai lang, sắn.","Cam, xoài, nhãn, vải.","Chè, cà phê, cao su, hồ tiêu.","Rau muống, bắp cải, cà chua, cà rốt."],"answer":"A","explanation":"Lúa, ngô, khoai lang và sắn được xếp vào nhóm cây lương thực.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":3,"question":"Cây chè, cây cà phê, cây cao su thuộc nhóm cây trồng nào dưới đây?","options":["Cây ăn quả.","Cây công nghiệp.","Cây lương thực.","Cây rau."],"answer":"B","explanation":"Chè, cà phê và cao su thuộc nhóm cây công nghiệp.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":4,"question":"Phương thức trồng trọt nào tiến hành trong điều kiện tự nhiên, có ưu điểm đơn giản, dễ thực hiện và áp dụng được trên diện tích lớn?","options":["Trồng trọt trong nhà kính.","Trồng trọt ngoài tự nhiên.","Trồng trọt thuỷ canh hoàn toàn.","Trồng trọt trong nhà lưới kín."],"answer":"B","explanation":"Trồng trọt ngoài tự nhiên diễn ra trên đồng ruộng, chịu tác động trực tiếp của điều kiện thiên nhiên.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":5,"question":"Nhược điểm lớn nhất của phương thức trồng trọt ngoài tự nhiên là gì?","options":["Chi phí đầu tư ban đầu quá cao.","Yêu cầu kĩ thuật quá phức tạp.","Cây trồng dễ bị tác động bởi sâu, bệnh hại và thời tiết bất lợi.","Không thể áp dụng cho các cây lương thực như lúa, ngô."],"answer":"C","explanation":"Ngoài tự nhiên khó kiểm soát thời tiết và sâu, bệnh hại; đây là hạn chế nổi bật.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":6,"question":"Phương thức trồng trọt trong nhà có mái che có ưu điểm nổi bật nào sau đây?","options":["Chi phí đầu tư ban đầu rất thấp.","Không đòi hỏi kĩ thuật cao.","Giúp kiểm soát điều kiện ngoại cảnh, hạn chế sâu bệnh, tạo năng suất cao và chủ động chăm sóc.","Áp dụng dễ dàng trên hàng triệu hecta cánh đồng lúa nước."],"answer":"C","explanation":"Nhà có mái che giúp chủ động điều chỉnh môi trường và hạn chế tác động bất lợi; thường cần đầu tư lớn và kỹ thuật cao.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":7,"question":"Điểm khác biệt cơ bản giữa trồng trọt công nghệ cao và trồng trọt truyền thống là gì?","options":["Chỉ sử dụng sức người và công cụ thô sơ.","Ưu tiên sử dụng giống mới năng suất cao, tự động hoá quy trình và ứng dụng công nghệ hiện đại.","Không cần tới sự quản lý và điều khiển của con người.","Chỉ trồng cây trong môi trường nước không dùng đất."],"answer":"B","explanation":"Trồng trọt công nghệ cao ứng dụng giống tốt, hệ thống tự động và kỹ thuật hiện đại để tăng hiệu quả.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":8,"question":"Trong trồng trọt công nghệ cao, đất trồng thường được thay thế bằng loại vật liệu nào?","options":["Cát mịn khô ráo.","Các loại giá thể hoặc dung dịch dinh dưỡng.","Bê tông xốp.","Đá vôi nghiền nhỏ."],"answer":"B","explanation":"Giá thể và dung dịch dinh dưỡng được dùng trong một số mô hình trồng trọt không dùng đất.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":9,"question":"Người làm nhiệm vụ giám sát, quản lý toàn bộ quy trình trồng trọt, nghiên cứu cải tiến kĩ thuật để tăng năng suất nông sản thuộc ngành nghề nào?","options":["Kĩ sư chọn giống cây trồng.","Kĩ sư bảo vệ thực vật.","Kĩ sư trồng trọt.","Kĩ thuật viên lâm nghiệp."],"answer":"C","explanation":"Kĩ sư trồng trọt giám sát quy trình, nghiên cứu và cải tiến kỹ thuật canh tác.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":10,"question":"Ngành nghề nào trong trồng trọt chuyên nghiên cứu và phòng trừ các tác nhân gây hại cho cây trồng nhằm bảo vệ sản xuất và môi trường?","options":["Kĩ sư chọn giống cây trồng.","Kĩ sư bảo vệ thực vật.","Kĩ sư chăn nuôi.","Bác sĩ thú y."],"answer":"B","explanation":"Kĩ sư bảo vệ thực vật nghiên cứu sâu, bệnh hại và biện pháp bảo vệ cây trồng.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":11,"question":"Phẩm chất quan trọng hàng đầu cần có của một kĩ sư chọn giống cây trồng là gì?","options":["Yêu thích cây trồng, thích nghiên cứu khoa học, cẩn thận, kiên trì và tỉ mỉ.","Thích điều khiển các loại máy móc hạng nặng trên đồng ruộng.","Thích thương lượng giá cả nông sản trên thị trường.","Thích thiết kế các phần mềm đồ hoạ."],"answer":"A","explanation":"Người chọn tạo giống cần yêu cây, kiên trì, cẩn thận và có tinh thần nghiên cứu.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":12,"question":"Yếu tố tự nhiên nào của Việt Nam tạo lợi thế lớn cho việc phát triển nhiều loại cây trồng khác nhau?","options":["Khí hậu nhiệt đới gió mùa, đất trồng đa dạng (đồng bằng, trung du, miền núi).","Khí hậu băng giá quanh năm.","Diện tích hoang mạc cát rộng lớn.","Mạng lưới sông hồ đóng băng vào mùa đông."],"answer":"A","explanation":"Việt Nam có khí hậu nhiệt đới gió mùa và nhiều loại đất, địa hình nên trồng được nhiều nhóm cây.","topic":"Giới thiệu trồng trọt","source":"SGK Bài 1, tr. 6–11"},{"n":13,"question":"Đất trồng gồm những thành phần chính nào?","options":["Phần rắn, phần lỏng, phần khí.","Phần đất, phần đá, phần sỏi.","Phần hữu cơ, phần vô cơ, phần hoai mục.","Phần nước, phần phân bón, phần vi sinh vật."],"answer":"A","explanation":"Đất trồng gồm phần rắn, phần lỏng và phần khí.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":14,"question":"Thành phần nào của đất trồng có vai trò cung cấp chất dinh dưỡng cần thiết cho cây và giúp cây đứng vững?","options":["Phần khí.","Phần lỏng.","Phần rắn.","Phần vi sinh vật."],"answer":"C","explanation":"Phần rắn cung cấp chất dinh dưỡng và giúp cây bám rễ, đứng vững.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":15,"question":"Vai trò chính của phần lỏng (nước trong đất) đối với cây trồng là gì?","options":["Cung cấp oxygen cho rễ hô hấp.","Cung cấp nước và hoà tan các chất dinh dưỡng giúp cây dễ hấp thụ.","Giữ cho cây đứng vững không bị đổ.","Diệt trừ các loại vi khuẩn gây bệnh trong đất."],"answer":"B","explanation":"Phần lỏng cung cấp nước và hòa tan các chất dinh dưỡng để rễ hấp thụ.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":16,"question":"Phần khí trong đất trồng có tác dụng chủ yếu nào sau đây?","options":["Cung cấp khí oxygen cho rễ cây hô hấp và làm đất tơi xốp.","Cung cấp đạm hữu cơ trực tiếp cho lá cây.","Giữ nước không bị bay hơi.","Hòa tan phân bón lót."],"answer":"A","explanation":"Phần khí cung cấp oxygen cho rễ hô hấp; đất thoáng khí thuận lợi cho cây.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":17,"question":"Công việc cày đất trong quy trình làm đất có mục đích chính là gì?","options":["Làm nhỏ đất và san phẳng mặt ruộng.","Xáo trộn lớp đất mặt ở độ sâu 20–30 cm, làm tăng bề dày lớp đất trồng, chôn vùi cỏ dại và làm đất tơi xốp.","Tạo rãnh thoát nước cho cây.","Giúp phân bón lá bám chặt vào thân cây."],"answer":"B","explanation":"Cày đất làm xáo trộn đất mặt, tăng độ sâu lớp canh tác, vùi cỏ dại và làm đất tơi xốp.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":18,"question":"Tác dụng của công việc bừa và đập đất là gì?","options":["Làm nhỏ đất, thu gom cỏ dại, trộn đều phân bón và san phẳng mặt ruộng.","Đắp mô cao để chống ngập úng.","Tạo hàng rào bảo vệ xung quanh ruộng.","Cắt tỉa các cành cây bị sâu bệnh."],"answer":"A","explanation":"Bừa và đập đất làm nhỏ đất, thu gom cỏ, san phẳng và có thể trộn đều phân.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":19,"question":"Việc lên luống (hoặc đắp mô) khi trồng trọt được áp dụng nhằm mục đích gì?","options":["Giúp dễ chăm sóc, chống ngập úng và tạo tầng đất dày cho rễ cây phát triển.","Tiết kiệm tối đa lượng phân bón lót.","Thay thế hoàn toàn cho việc tưới nước.","Tăng độ chua của đất trồng."],"answer":"A","explanation":"Lên luống giúp thoát nước, chống ngập úng, thuận lợi chăm sóc và phát triển bộ rễ.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":20,"question":"Bón phân lót là việc bón phân vào đất vào thời điểm nào?","options":["Khi cây đang ra hoa kết quả.","Trước khi gieo trồng nhằm chuẩn bị sẵn “thức ăn” cho cây khi rễ vừa phát triển.","Ngay trước khi thu hoạch sản phẩm 2 ngày.","Khi cây bị sâu bệnh tấn công nặng."],"answer":"B","explanation":"Bón lót là bón phân vào đất trước khi gieo trồng để chuẩn bị dinh dưỡng ban đầu.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":21,"question":"Loại phân bón nào thường được ưu tiên sử dụng để bón lót cho đất trồng?","options":["Phân đạm hoá học tan nhanh.","Phân hữu cơ hoai mục hoặc phân lân.","Phân bón lá phun sương.","Thuốc trừ sâu sinh học."],"answer":"B","explanation":"Phân hữu cơ hoai mục và phân lân thường phù hợp để bón lót.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":22,"question":"Các hình thức bón phân lót phổ biến hiện nay bao gồm:","options":["Rắc đều trên mặt ruộng, bón theo hàng hoặc bón theo hốc.","Phun trực tiếp lên mặt dưới của lá.","Hòa tan vào bình xịt để phun sương trên không.","Tiêm trực tiếp vào thân cây gỗ."],"answer":"A","explanation":"Có thể bón lót bằng cách rắc đều, bón theo hàng hoặc theo hốc.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":23,"question":"Làm đất trồng cây là công đoạn nằm ở vị trí nào trong quy trình trồng trọt?","options":["Công đoạn cuối cùng trước khi tiêu thụ.","Công đoạn đầu tiên trong quy trình trồng trọt.","Công đoạn diễn ra sau khi đã thu hoạch xong.","Công đoạn thực hiện song song với thu hoạch."],"answer":"B","explanation":"Làm đất là công việc đầu tiên để chuẩn bị điều kiện cho gieo trồng.","topic":"Đất trồng và làm đất","source":"SGK Bài 2, tr. 12–13"},{"n":24,"question":"Có mấy hình thức gieo trồng chính được áp dụng phổ biến hiện nay?","options":["1 hình thức (chỉ gieo hạt).","2 hình thức chính (gieo hạt và trồng cây con).","5 hình thức.","10 hình thức."],"answer":"B","explanation":"Hai hình thức gieo trồng chính là gieo hạt và trồng cây con.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":25,"question":"Việc gieo hạt trực tiếp thường được áp dụng cho nhóm cây trồng nào?","options":["Cây ăn quả lâu năm như cam, xoài.","Các loại cây trồng ngắn ngày (lúa, ngô, đỗ, rau...) và trong vườn ươm.","Các loại cây lấy gỗ lớn như xà cừ, bạch đàn.","Cây công nghiệp lâu năm như cao su, ca cao."],"answer":"B","explanation":"Gieo hạt phổ biến với cây ngắn ngày như lúa, ngô, đỗ, rau và trong vườn ươm.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":26,"question":"Khái niệm “thời vụ gieo trồng” được hiểu như thế nào?","options":["Thời gian thu hoạch sản phẩm nông nghiệp.","Khoảng thời gian nhất định trong năm được xác định để gieo trồng cho từng loại cây.","Thời gian làm đất trước khi gieo hạt.","Khoảng thời gian bón phân thúc cho cây."],"answer":"B","explanation":"Thời vụ gieo trồng là khoảng thời gian thích hợp trong năm cho mỗi loại cây.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":27,"question":"Mục đích chính của việc tỉa và dặm cây sau khi gieo trồng là gì?","options":["Loại bỏ cây yếu, cây bị bệnh và dặm cây khỏe vào chỗ hạt không mọc để đảm bảo mật độ, khoảng cách.","Tăng kích thước của hạt giống.","Thay thế việc bón phân lót.","Thu hoạch sớm các sản phẩm dư thừa."],"answer":"A","explanation":"Tỉa bỏ cây yếu, dặm cây khỏe vào chỗ trống nhằm đảm bảo mật độ và khoảng cách.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":28,"question":"Tác dụng của công việc làm cỏ, vun xới đối với cây trồng là gì?","options":["Giảm sự cạnh tranh dinh dưỡng của cỏ dại, hạn chế nơi trú ẩn của sâu bệnh, làm đất tơi xốp, giúp cây đứng vững.","Làm cho lá cây chuyển sang màu vàng.","Tăng lượng nước đọng trên mặt ruộng gây úng.","Giảm lượng oxygen trong đất."],"answer":"A","explanation":"Làm cỏ giảm cạnh tranh dinh dưỡng, vun xới giúp đất thoáng, tơi xốp, cây đứng vững.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":29,"question":"Nếu thừa nước kéo dài, cây trồng sẽ gặp hiện tượng nguy hại nào?","options":["Cây phát triển cực kỳ nhanh chóng.","Gây ngập úng, rễ cây bị ngạt, lá bị vàng úa và cây có thể bị chết.","Cây không bao giờ bị sâu bệnh tấn công.","Hạt giống mọc mầm ngay trên cành."],"answer":"B","explanation":"Thừa nước kéo dài gây úng, thiếu oxygen ở rễ; cây vàng lá, giảm sinh trưởng hoặc chết.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":30,"question":"Bón phân thúc là việc bón phân vào thời điểm nào của cây trồng?","options":["Trước khi gieo hạt vào đất.","Trong các giai đoạn sinh trưởng và phát triển của cây nhằm cung cấp đầy đủ, kịp thời dinh dưỡng.","Sau khi đã thu hoạch toàn bộ sản phẩm.","Khi làm đất cày bừa."],"answer":"B","explanation":"Bón thúc trong quá trình cây sinh trưởng, phát triển để cung cấp dinh dưỡng kịp thời.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":31,"question":"Nguyên tắc hàng đầu trong công tác phòng trừ sâu, bệnh hại cây trồng là gì?","options":["Dùng thuốc hoá học thật nhiều khi sâu xuất hiện.","“Phòng là chính”.","Chờ cây chết mới xử lý.","Đốt toàn bộ cánh đồng khi có sâu nhỏ."],"answer":"B","explanation":"Phòng là chính: ưu tiên ngăn sâu, bệnh phát sinh và lây lan trước khi phải xử lý.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":32,"question":"Biện pháp phòng trừ sâu bệnh nào có tác dụng làm sạch đồng ruộng, gieo trồng đúng thời vụ, bón phân hợp lý và luân canh để hạn chế mầm bệnh?","options":["Biện pháp hóa học.","Biện pháp canh tác.","Biện pháp cơ giới thô sơ.","Biện pháp sinh học."],"answer":"B","explanation":"Vệ sinh đồng ruộng, gieo đúng thời vụ, luân canh, chăm bón hợp lý thuộc biện pháp canh tác.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":33,"question":"Biện pháp thủ công trong phòng trừ sâu bệnh bao gồm những việc làm nào?","options":["Dùng tay bắt sâu, ngắt bỏ cành lá bị bệnh, dùng bẫy, vợt diệt sâu.","Phun thuốc trừ sâu hoá học liều cao.","Sử dụng máy bay không người lái xịt thuốc.","Thả ong mắt đỏ ra đồng ruộng."],"answer":"A","explanation":"Bắt sâu, bẫy sâu và cắt bỏ bộ phận bị bệnh là biện pháp thủ công.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":34,"question":"Yêu cầu nào sau đây không nằm trong nguyên tắc “4 đúng” khi sử dụng thuốc bảo vệ thực vật hoá học?","options":["Đúng thuốc, đúng nồng độ và liều lượng.","Đúng thời điểm, đúng kĩ thuật.","Đúng giá tiền cao nhất trên thị trường.","Đảm bảo thời gian cách ly an toàn trước khi thu hoạch."],"answer":"C","explanation":"“4 đúng” gồm đúng thuốc, đúng nồng độ/liều lượng, đúng lúc và đúng cách; giá cao không phải tiêu chí. Thời gian cách ly là yêu cầu an toàn bổ sung.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":35,"question":"Ưu điểm vượt trội của biện pháp sinh học trong phòng trừ sâu bệnh hại là gì?","options":["Tiêu diệt sâu bệnh nhanh tức thì trong vài phút.","Có hiệu quả cao, an toàn và không gây ô nhiễm môi trường sinh thái.","Chi phí luôn rẻ hơn tất cả các biện pháp khác.","Không cần bất kỳ kĩ thuật hay sự quan sát nào."],"answer":"B","explanation":"Biện pháp sinh học sử dụng tác nhân sinh học, góp phần bảo vệ môi trường và an toàn hơn khi áp dụng đúng.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"SGK Bài 3, tr. 14–18"},{"n":36,"question":"Mục đích chính của việc thu hoạch sản phẩm trồng trọt là gì?","options":["Thu hái sản phẩm đúng lúc để đạt chất lượng tốt nhất, năng suất cao và giảm hao hụt.","Dọn sạch đồng ruộng để chuẩn bị làm đường giao thông.","Cắt bỏ toàn bộ cây trồng bất kể già hay trẻ.","Làm cho đất trồng bớt phì nhiêu."],"answer":"A","explanation":"Thu hoạch kịp thời, đúng cách giúp giữ chất lượng, năng suất và giảm hao hụt.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":37,"question":"Yêu cầu quan trọng khi thu hoạch sản phẩm trồng trọt là gì?","options":["Thu hoạch đúng lúc, nhanh, gọn, cẩn thận và dùng phương pháp/dụng cụ phù hợp.","Phải thu hoạch vào đêm muộn.","Kéo dài thời gian thu hoạch càng lâu càng tốt.","Dùng lực thật mạnh làm dập nát sản phẩm."],"answer":"A","explanation":"Thu hoạch cần đúng thời điểm, nhanh gọn, cẩn thận và chọn phương pháp, dụng cụ phù hợp.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":38,"question":"Phương pháp thu hoạch nào thường áp dụng cho các loại rau, đỗ, nhãn, chôm chôm?","options":["Phương pháp đào.","Phương pháp hái.","Phương pháp cắt.","Phương pháp đập."],"answer":"B","explanation":"Hái là phương pháp phổ biến với rau, đỗ và các loại quả như nhãn, chôm chôm trong ví dụ của sách.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":39,"question":"Các loại cây củ như khoai lang, khoai tây thường được thu hoạch bằng phương pháp nào?","options":["Hái.","Đào.","Cắt.","Bẻ."],"answer":"B","explanation":"Đào được áp dụng với một số nông sản củ nằm dưới đất như khoai lang, khoai tây.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":40,"question":"Cây su hào, cây sắn (khoai mì), cây lạc (đậu phộng) thường áp dụng phương pháp thu hoạch phổ biến nào?","options":["Cắt.","Nhổ.","Hái.","Bóp dập."],"answer":"B","explanation":"Nhổ được áp dụng với su hào, sắn và lạc theo phân loại ví dụ trong SGK.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":41,"question":"Thu hoạch lúa, hoa tươi, bắp cải thường sử dụng phương pháp nào?","options":["Cắt.","Đào.","Bóc vỏ.","Giã."],"answer":"A","explanation":"Cắt được dùng khi thu hoạch lúa, hoa tươi, bắp cải.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":42,"question":"Việc đưa các loại máy móc hiện đại (như máy thu hoạch lúa, máy thu hoạch ngô) vào sản xuất mang lại lợi ích gì?","options":["Nâng cao hiệu quả thu hoạch, tiết kiệm thời gian và giảm sức lao động.","Làm dập nát toàn bộ nông sản.","Làm tăng chi phí nhân công lên gấp nhiều lần.","Làm hỏng toàn bộ kết cấu đất trồng."],"answer":"A","explanation":"Máy thu hoạch giúp nâng cao năng suất lao động, rút ngắn thời gian và tăng hiệu quả.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":43,"question":"Nếu sản phẩm trồng trọt sau khi thu hoạch không được bảo quản hoặc bảo quản không đúng cách sẽ dẫn đến hậu quả gì?","options":["Sản phẩm tươi lâu hơn.","Sản phẩm bị hao hụt về số lượng và giảm chất lượng (thối, hỏng, biến chất).","Giá trị nông sản tăng vọt.","Tăng hàm lượng vitamin trong sản phẩm."],"answer":"B","explanation":"Không bảo quản đúng cách làm nông sản hao hụt số lượng, giảm chất lượng và dễ hỏng.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":44,"question":"Phương pháp bảo quản nào sử dụng nhiệt độ thấp để làm chậm sự hoạt động của vi sinh vật và enzyme, giúp nông sản tươi lâu?","options":["Bảo quản thường trong kho.","Bảo quản lạnh.","Bảo quản bằng cách phơi nắng gắt.","Bảo quản ủ nóng."],"answer":"B","explanation":"Bảo quản lạnh dùng nhiệt độ thấp giúp làm chậm biến đổi và sự phát triển của vi sinh vật.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"},{"n":45,"question":"Các phương pháp bảo quản sản phẩm trồng trọt phổ biến hiện nay gồm có:","options":["Bảo quản thường, bảo quản lạnh, bảo quản kín, bảo quản hút chân không.","Ngâm vào hóa chất tẩy rửa mạnh.","Đốt sơ qua lửa trực tiếp.","Phủ đất mùn lên toàn bộ lá rau."],"answer":"A","explanation":"Các cách bảo quản phổ biến gồm bảo quản thường, bảo quản lạnh, bảo quản kín và hút chân không.","topic":"Thu hoạch và bảo quản","source":"SGK Bài 4, tr. 19–20"}],"essays":[{"n":1,"question":"Trình bày các vai trò chính của ngành trồng trọt đối với đời sống con người và nền kinh tế ở Việt Nam. Cho ví dụ minh họa cho từng vai trò.","points":["Trồng trọt cung cấp lương thực, thực phẩm cho con người (ví dụ: lúa gạo, ngô, rau, quả).","Cung cấp thức ăn cho chăn nuôi (ví dụ: ngô, cỏ voi, cây thức ăn xanh).","Cung cấp nguyên liệu cho công nghiệp chế biến (ví dụ: mía sản xuất đường, chè chế biến đồ uống, sắn chế biến tinh bột).","Cung cấp nông sản để xuất khẩu, tạo việc làm và thu nhập (ví dụ: gạo, cà phê, hồ tiêu, rau quả)."],"source":"SGK Bài 1, tr. 6–11"},{"n":2,"question":"So sánh ưu điểm và hạn chế của phương thức trồng trọt ngoài tự nhiên và trồng trọt trong nhà có mái che (nhà kính, nhà màng). Vì sao trồng trọt công nghệ cao là xu hướng phát triển tất yếu hiện nay?","points":["Ngoài tự nhiên: dễ thực hiện, chi phí đầu tư thấp, thuận tiện sản xuất diện tích lớn; hạn chế là phụ thuộc thời tiết và chịu tác động của sâu, bệnh.","Trong nhà có mái che: chủ động kiểm soát một phần nhiệt độ, độ ẩm, nước tưới; hạn chế sâu bệnh, năng suất và chất lượng ổn định hơn; hạn chế là chi phí đầu tư và kỹ thuật thường cao.","Trồng trọt công nghệ cao sử dụng giống phù hợp, thiết bị tự động và kỹ thuật hiện đại để nâng năng suất, chất lượng, tiết kiệm nguồn lực; đây là xu hướng phát triển, không có nghĩa mọi cây và mọi địa phương đều phải dùng cùng một công nghệ."],"source":"SGK Bài 1, tr. 9–11"},{"n":3,"question":"Trình bày mục đích của các công việc làm đất chính (cày đất, bừa/đập đất, lên luống). Vì sao trước khi gieo trồng cần làm đất kĩ?","points":["Cày đất: làm xáo trộn lớp đất, tăng bề dày lớp canh tác, vùi cỏ và làm đất tơi xốp.","Bừa, đập đất: làm nhỏ đất, thu gom cỏ dại, trộn đều phân bón và san phẳng bề mặt.","Lên luống/đắp mô: thuận tiện chăm sóc, tiêu thoát nước, chống úng và tạo điều kiện phát triển rễ.","Làm đất kỹ trước gieo trồng tạo đất tơi, thoáng khí, đủ độ sâu, hạn chế cỏ và giúp cây nảy mầm, bén rễ tốt."],"source":"SGK Bài 2, tr. 12–13"},{"n":4,"question":"Phân biệt bón phân lót và bón phân thúc. Vì sao phân hữu cơ hoai mục và phân lân thường được dùng để bón lót trước khi gieo trồng?","points":["Bón lót: bón phân vào đất trước khi gieo trồng để chuẩn bị sẵn dinh dưỡng cho cây giai đoạn đầu.","Bón thúc: bón khi cây đang sinh trưởng, phát triển để bổ sung dinh dưỡng đúng giai đoạn.","Phân hữu cơ đã hoai mục và phân lân thường dùng bón lót vì thích hợp để cải tạo đất, tạo nguồn dinh dưỡng ban đầu; phân hữu cơ chưa hoai mục có thể gây bất lợi cho rễ."],"source":"SGK Bài 2, tr. 13"},{"n":5,"question":"Nêu các biện pháp chăm sóc cây trồng phổ biến. Phân tích hậu quả đối với cây trồng khi bị thiếu nước hoặc ngập úng kéo dài.","points":["Các công việc chăm sóc: tỉa và dặm cây; làm cỏ, vun xới; tưới nước; tiêu nước; bón phân thúc.","Thiếu nước: tế bào giảm sức trương, cây héo, sinh trưởng kém; kéo dài có thể chết.","Thừa nước/ngập úng: đất thiếu không khí, rễ khó hô hấp, cây vàng lá, suy yếu và có thể chết.","Cần tưới và tiêu nước kịp thời, phù hợp từng loại cây, loại đất và thời tiết."],"source":"SGK Bài 3, tr. 15–18"},{"n":6,"question":"Giải thích ý nghĩa của nguyên tắc “Phòng là chính” trong phòng trừ sâu, bệnh hại. Trình bày nội dung nguyên tắc “4 đúng” khi sử dụng thuốc bảo vệ thực vật hóa học.","points":["“Phòng là chính” nghĩa là chủ động ngăn sâu, bệnh hại phát sinh và lây lan bằng vệ sinh đồng ruộng, giống khỏe, gieo đúng thời vụ, luân canh, chăm sóc phù hợp; khi có sâu, bệnh cần phát hiện và xử lý kịp thời.","Nguyên tắc “4 đúng” khi dùng thuốc bảo vệ thực vật: đúng thuốc; đúng nồng độ và liều lượng; đúng lúc; đúng cách/kĩ thuật.","Ngoài 4 đúng, phải tuân thủ thời gian cách ly, trang bị bảo hộ và hướng dẫn trên nhãn; không lạm dụng thuốc hóa học."],"source":"SGK Bài 3, tr. 17–18"},{"n":7,"question":"Nêu các yêu cầu kĩ thuật chung khi thu hoạch sản phẩm trồng trọt. Trình bày bốn phương pháp thu hoạch phổ biến và cho ví dụ nông sản phù hợp với từng phương pháp.","points":["Thu hoạch đúng độ chín, đúng thời điểm; nhanh, gọn, cẩn thận, giảm dập nát; chọn phương pháp và dụng cụ phù hợp.","Hái: ví dụ rau, đỗ, nhãn, chôm chôm.","Nhổ: ví dụ su hào, sắn, lạc.","Đào: ví dụ khoai lang, khoai tây.","Cắt: ví dụ lúa, hoa tươi, bắp cải.","Sau thu hoạch cần bảo quản phù hợp để hạn chế hao hụt và giảm chất lượng."],"source":"SGK Bài 4, tr. 19–20"},{"n":8,"question":"Trình bày quy trình năm bước nhân giống cây trồng bằng phương pháp giâm cành. Vì sao khi cắt cành giâm người ta thường cắt vát ở phần gốc và cắt bớt phiến lá?","points":["Lưu ý đối chiếu: đề cương yêu cầu “4 bước”, nhưng SGK Công nghệ 7, Bài 5, tr. 22 ghi 5 bước thực hiện giâm cành.","Bước 1. Chọn cành giâm: cành bánh tẻ, khỏe mạnh, không quá non hoặc quá già, không sâu bệnh.","Bước 2. Cắt cành giâm: dùng dao sắc cắt đoạn cành có chiều dài phù hợp; có thể cắt vát gốc.","Bước 3. Xử lí cành giâm: nhúng gốc cành vào dung dịch kích thích ra rễ khi cần.","Bước 4. Cắm cành giâm: cắm cành vào đất/giá thể ẩm, thích hợp.","Bước 5. Chăm sóc cành giâm: tưới giữ ẩm, tránh nắng gắt, theo dõi đến khi ra rễ và lá mới.","Giải thích bổ sung về sinh lí thực vật: cắt vát có thể tăng diện tích tiếp xúc với môi trường ẩm và giúp cắm thuận tiện; tỉa bớt lá nhằm giảm thoát hơi nước khi cành chưa có rễ hoàn chỉnh.","Nếu giáo viên yêu cầu trình bày thành 4 công đoạn, có thể gộp “chọn và cắt cành” thành một công đoạn; tuy nhiên cần ghi đủ 5 thao tác mà SGK nêu."],"source":"SGK Bài 5, tr. 21–23"}],"advanced":[{"n":1,"question":"Một gia đình trồng xà lách ở sân thượng thường gặp mưa lớn. Cách nào giúp chủ động hạn chế cây bị dập và úng?","options":["Chỉ tăng lượng phân đạm","Lắp mái che phù hợp, bố trí thoát nước và theo dõi độ ẩm","Ngừng tưới hoàn toàn cả tháng","Che kín không cho ánh sáng vào"],"answer":"B","explanation":"Mái che kết hợp thoát nước phù hợp giúp giảm tác hại của mưa và úng, vẫn cần đủ ánh sáng.","topic":"Giới thiệu trồng trọt","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":2,"question":"Một nhóm muốn trồng rau thủy canh. Vật liệu nào có thể thay đất trồng trong mô hình phù hợp?","options":["Bê tông đặc","Dung dịch dinh dưỡng và giá thể phù hợp","Đá lạnh","Cát hoàn toàn khô"],"answer":"B","explanation":"Trồng không đất dùng dung dịch dinh dưỡng, có thể kết hợp giá thể giữ cây.","topic":"Giới thiệu trồng trọt","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":3,"question":"Vườn cà chua ngoài trời liên tục nhiễm sâu bệnh sau nhiều vụ. Cách cải thiện phòng ngừa phù hợp?","options":["Luân canh và vệ sinh đồng ruộng","Tăng mật độ trồng tối đa","Phun thuốc bất kể có sâu hay không","Bỏ kiểm tra vườn"],"answer":"A","explanation":"Luân canh, vệ sinh và theo dõi vườn là biện pháp canh tác phòng bệnh.","topic":"Giới thiệu trồng trọt","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":4,"question":"Nếu đất sau mưa bị đóng váng cứng, rễ thiếu khí, nên làm gì khi đất đã đủ ráo?","options":["Nén đất thật chặt","Xới phá váng nhẹ và điều chỉnh thoát nước","Đổ thêm nước ngay","Phủ bê tông lên đất"],"answer":"B","explanation":"Xới làm đất thoáng, giúp trao đổi khí; cần tránh làm khi đất còn quá ướt.","topic":"Đất trồng và làm đất","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":5,"question":"Vì sao không nên dùng phân hữu cơ chưa hoai mục sát rễ non?","options":["Vì luôn làm cây ra hoa","Vì có thể sinh nhiệt, mang mầm bệnh và gây hại rễ","Vì không có bất cứ chất dinh dưỡng nào","Vì làm không khí lạnh đi"],"answer":"B","explanation":"Phân hữu cơ nên được xử lí hoai mục trước khi bón lót để an toàn cho cây.","topic":"Đất trồng và làm đất","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":6,"question":"Nhóm học sinh trồng rau ở nơi dễ đọng nước. Khâu làm đất nào đặc biệt quan trọng?","options":["Lên luống, tạo rãnh thoát nước","Đổ đầy nước vào luống","Chỉ san thật phẳng không có rãnh","Loại hết phần khí trong đất"],"answer":"A","explanation":"Lên luống chống ngập úng và giúp rễ có môi trường thuận lợi.","topic":"Đất trồng và làm đất","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":7,"question":"Một khay rau lên quá dày, cây chen chúc nhau. Biện pháp chăm sóc phù hợp nhất?","options":["Tỉa bớt cây yếu để bảo đảm mật độ","Ngừng chiếu sáng","Bón thuốc trừ sâu dù không có sâu","Nhổ tất cả cây khỏe"],"answer":"A","explanation":"Tỉa cây giúp giảm cạnh tranh dinh dưỡng, ánh sáng và không gian.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":8,"question":"Phát hiện vài lá bị sâu ăn trên một luống rau nhỏ. Biện pháp ưu tiên an toàn có thể là?","options":["Bắt sâu, ngắt lá bị bệnh và theo dõi","Phun gấp đôi liều khuyến cáo","Đốt cả vườn rau","Bỏ qua mọi dấu hiệu"],"answer":"A","explanation":"Bắt sâu và ngắt bỏ lá bị hại thuộc biện pháp thủ công; cần theo dõi tình hình.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":9,"question":"Khi phun thuốc bảo vệ thực vật theo hướng dẫn, điều nào cũng cần được tuân thủ ngoài “4 đúng”?","options":["Thời gian cách ly an toàn","Mua thuốc đắt nhất","Phun sát ngày thu hoạch tùy ý","Không cần bảo hộ"],"answer":"A","explanation":"Ngoài “4 đúng” cần bảo hộ lao động, bảo vệ môi trường và bảo đảm thời gian cách ly.","topic":"Gieo trồng, chăm sóc và phòng trừ","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":10,"question":"Sau khi thu hoạch rau ăn lá, giải pháp nào giúp hạn chế héo nhanh khi vận chuyển ngắn?","options":["Để nắng gắt ngoài sân","Làm mát và bảo quản ở nhiệt độ phù hợp","Chất đống cạnh nguồn nhiệt","Làm dập nát lá"],"answer":"B","explanation":"Bảo quản lạnh/mát phù hợp làm chậm mất nước và hư hỏng.","topic":"Thu hoạch và bảo quản","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":11,"question":"Một hộ thu hoạch khoai tây. Dụng cụ và phương pháp nào phù hợp nhất?","options":["Đào nhẹ để tránh xây xát củ","Giật mạnh mọi thân lá","Dùng máy cắt hoa","Hái củ trên lá"],"answer":"A","explanation":"Đào khoai nhẹ nhàng giúp giảm sứt mẻ nông sản.","topic":"Thu hoạch và bảo quản","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"},{"n":12,"question":"Khi giâm một đoạn cành chưa có rễ hoàn chỉnh, nên làm gì để hạn chế mất nước?","options":["Tỉa bớt lá, giữ ẩm và tránh nắng gắt","Để cành nơi khô nóng","Bỏ toàn bộ nước tưới","Bón thật nhiều đạm vào cành"],"answer":"A","explanation":"Tỉa bớt lá giảm thoát hơi nước và chăm sóc giữ ẩm giúp cành phát triển rễ.","topic":"Nhân giống vô tính","source":"Câu vận dụng biên soạn thêm theo SGK Công nghệ 7, Chương I"}],"schema":2}</script>

d.body.append(top,foot);
const btn=foot.querySelector('button'),hint=foot.querySelector('#u7-hint');

let original=null,lastScreen='';
function usable(n){
 if(!n||n===btn||n.disabled||n.hidden||n.hasAttribute('hidden'))return false;
 for(let a=n;a&&a!==d.body;a=a.parentElement){
  if(a.hidden||a.getAttribute('aria-hidden')==='true'||a.classList.contains('hidden')||a.classList.contains('hide')||a.style.display==='none')return false;
